[project]
name = "reel-to-tandoor"
version = "0.1.0"
description = "Save an Instagram reel's recipe into Tandoor from an iOS Shortcut"
authors = [
    { name = "Saul Burgess", email = "Solonerus@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "imageio-ffmpeg>=0.8.1",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
reel-to-tandoor = "reel_to_tandoor:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
